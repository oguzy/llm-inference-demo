# The one shared Gateway. llm-d's router chart and KServe both attach
# HTTPRoutes to it, from any namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: inference-gateway
spec:
  gatewayClassName: envoy-ai-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
# Envoy Gateway's default 32KiB buffer is too small for LLM requests.
# From llm-d guides/recipes/gateway/envoy-ai-gateway.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: client-buffer-limit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: inference-gateway
  connection:
    bufferLimit: 50Mi
