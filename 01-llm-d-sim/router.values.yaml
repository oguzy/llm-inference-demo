## Values for oci://ghcr.io/llm-d/charts/llm-d-router-standalone.
## Adapted from llm-d's guides/recipes/router/base.values.yaml and
## guides/optimized-baseline/router/optimized-baseline.values.yaml, with
## resources cut down to fit a laptop-sized kind cluster.

router:
  # Expose Envoy on port 80 of the <release>-epp Service.
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    replicas: 1
    flags:
      v: 2
    pluginsConfigFile: "demo-plugins.yaml"
    pluginsCustomConfig:
      demo-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: approx-prefix-cache-producer
        - type: inflight-load-producer
        - type: prefix-cache-affinity-filter
        - type: token-load-scorer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi

  inferencePool:
    failureMode: "FailOpen"

  modelServers:
    protocol: http
    matchLabels:
      llm-d.ai/guide: llm-inference-demo

  proxy:
    proxyType: envoy
    args:
      - "--service-node"
      - "envoy-sidecar"
      - "--log-level"
      - "warn"
      - "--concurrency"
      - "2"
      - "--drain-strategy"
      - "immediate"
      - "--drain-time-s"
      - "60"
      - "-c"
      - "/etc/envoy/envoy.yaml"
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi
